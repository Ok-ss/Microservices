apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
          - name: POSTGRES_DB
            valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_DB } }
          - name: POSTGRES_USER
            valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } }
          - name: POSTGRES_PASSWORD
            valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PASSWORD } }
        ports:
          - containerPort: 5432