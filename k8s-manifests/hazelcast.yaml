apiVersion: v1
kind: ServiceAccount
metadata:
  name: hazelcast-service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hazelcast-cluster-role
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hazelcast-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hazelcast-cluster-role
subjects:
- kind: ServiceAccount
  name: hazelcast-service-account
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: hazelcast-service
spec:
  clusterIP: None
  ports:
    - port: 5701
  selector:
    app: hazelcast
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hazelcast
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hazelcast
  template:
    metadata:
      labels:
        app: hazelcast
    spec:
      serviceAccountName: hazelcast-service-account
      containers:
      - name: hazelcast
        image: hazelcast/hazelcast:5.3
        ports:
        - containerPort: 5701
        env:
        - name: HZ_NETWORK_JOIN_KUBERNETES_ENABLED
          value: "true"
        - name: HZ_NETWORK_KUBERNETES_SERVICE_NAME
          value: "hazelcast-service"
        - name: HZ_NETWORK_KUBERNETES_NAMESPACE
          value: "default"