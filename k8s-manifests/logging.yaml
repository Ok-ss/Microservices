apiVersion: v1
kind: Service
metadata:
  name: logging-service
spec:
  ports:
    - port: 8000
  selector:
    app: logging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logging
  template:
    metadata:
      labels:
        app: logging
    spec:
      containers:
      - name: app
        image: microservices-logging:latest
        imagePullPolicy: Never
        ports:
          - containerPort: 8000
        envFrom:
          - configMapRef:
              name: app-config