services:
  # 1. Database for counter-service
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: counter_user
      POSTGRES_PASSWORD: counter_pass
      POSTGRES_DB: counter_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Config Server (Service Registry)
  config-server:
    build: ./config
    ports:
      - "8888:8888"
    networks:
      - mynetwork

  # 3. Hazelcast Cluster (MQ and Logging storage)
  # hazelcast:
  #   image: hazelcast/hazelcast:5.3
  #   networks:
  #     - mynetwork
  #   # deploy:
  #   #   endpoint_mode: dnsrr
  #   environment:
  #     - HZ_NETWORK_JOIN_MULTICAST_ENABLED=false
  #     - HZ_NETWORK_JOIN_TCPIP_ENABLED=true
  #     - HZ_NETWORK_JOIN_TCPIP_MEMBERS=hazelcast
  #     # - JAVA_OPTS=-Dhazelcast.local.publicAddress=hazelcast
  #     # - HZ_NETWORK_INTERFACE_PORT=5701
  #     # - HZ_NETWORK_INTERFACE_PUBLICADDRESS=0.0.0.0
  #     - JAVA_OPTS=-Dhazelcast.local.publicAddress=$$(hostname -i)

  hazelcast:
    image: hazelcast/hazelcast:5.3
    networks:
      - mynetwork
    environment:
      - HZ_CLUSTERNAME=dev
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=false
      - HZ_NETWORK_JOIN_TCPIP_ENABLED=false
      - HZ_NETWORK_JOIN_TCPIP_MEMBERS=hazelcast-*
      - HZ_NETWORK_JOIN_KUBERNETES_ENABLED=false
      - HZ_NETWORK_JOIN_AUTO_DETECTION_ENABLED=true

  # 4. Logging Service (Scaled to 3)
  logging:
    build: ./logging
    networks:
      - mynetwork
    depends_on:
      - hazelcast
      - config-server
    environment:
      - HAZELCAST_IP=hazelcast:5701

  # 5. Counter Service (Consumer)
  counter:
    build: ./counter
    ports:
      - "8002:8000"
    networks:
      - mynetwork
    depends_on:
      postgres:
        condition: service_healthy
      hazelcast:
        condition: service_started
      config-server:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://counter_user:counter_pass@postgres:5432/counter_db

  # 6. Facade Service (Producer & Entry Point)
  facade:
    build: ./facade
    ports:
      - "8000:8000"
    depends_on:
      - config-server
      - hazelcast
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  postgres_data: