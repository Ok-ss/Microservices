services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: counter_user
      POSTGRES_PASSWORD: counter_pass
      POSTGRES_DB: counter_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  hazelcast:
    image: hazelcast/hazelcast:5.3
    networks:
      - mynetwork
    volumes:
      - ./hazelcast_data:/opt/hazelcast/data

  logging:
    build: ./logging
    networks:
      - mynetwork
    depends_on:
      - hazelcast

  counter:
    build: ./counter
    ports:
      - "8002:8000"
    networks:
      - mynetwork
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://counter_user:counter_pass@postgres:5432/counter_db

  facade:
    build: ./facade
    ports:
      - "8000:8000"
    depends_on:
      - logging
      - counter
    networks:
      - mynetwork

networks:
  mynetwork:
